
<!DOCTYPE html>
<html>
<head>
  <title>Mint Your True Star NFT</title>
  <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/web3modal@1.9.12/dist/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
</head>
<body>
  <h1>Mint Your True Star NFT</h1>
  <button id="connectWallet">Connect Wallet</button>
  <div id="walletStatus"></div><br>
  <label>Quantity: <input id="quantity" type="number" value="1" min="1"></label>
  <button id="mintBtn">Mint for 0.05 ETH each</button>

  <script>
    const contractAddress = "0x2baAfa9961EDff4a313127Aa3baE2b9bd06FE58E";
    const abi = [{"inputs":[{"internalType":"uint256","name":"_numTokens","type":"uint256"}],"name":"publicMint","outputs":[],"stateMutability":"payable","type":"function"}];

    let provider;
    let signer;
    let contract;

    const providerOptions = {
      walletconnect: {
        package: window.WalletConnectProvider.default,
        options: {
          infuraId: "9aa8f9b1aa134d64bd2c", // fallback ID
        }
      }
    };

    const web3Modal = new window.Web3Modal.default({
      cacheProvider: false,
      providerOptions,
    });

    document.getElementById("connectWallet").addEventListener("click", async () => {
      try {
        const instance = await web3Modal.connect();
        provider = new ethers.providers.Web3Provider(instance);
        signer = provider.getSigner();
        const address = await signer.getAddress();
        contract = new ethers.Contract(contractAddress, abi, signer);
        document.getElementById("walletStatus").innerText = "Connected: " + address;
      } catch (err) {
        console.error("Wallet connection failed:", err);
        alert("Wallet connection failed.");
      }
    });

    document.getElementById("mintBtn").addEventListener("click", async () => {
      if (!contract) {
        alert("Connect your wallet first.");
        return;
      }
      const qty = parseInt(document.getElementById("quantity").value);
      const totalPrice = ethers.utils.parseEther("0.05").mul(qty);
      try {
        const tx = await contract.publicMint(qty, { value: totalPrice });
        await tx.wait();
        alert("Mint successful!");
      } catch (err) {
        alert("Mint failed: " + err.message);
      }
    });
  </script>
</body>
</html>
