
<!DOCTYPE html>
<html>
<head>
  <title>Gift NFTs</title>
  <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/web3modal@1.9.12/dist/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
</head>
<body>
  <h1>Admin: Gift NFTs</h1>
  <label>Password: <input type="password" id="adminPass"></label>
  <button onclick="checkPassword()">Enter</button>

  <div id="giftSection" style="display:none;">
    <button id="connectWallet">Connect Wallet</button><br><br>
    <div id="walletStatus"></div><br>
    <label>Wallets (comma separated):<br><textarea id="wallets" rows="5" cols="60"></textarea></label><br>
    <label>Quantity for each:<input id="quantity" type="number" value="1" min="1"></label><br>
    <button onclick="gift()">Send Gift Mints</button>
  </div>

  <script>
    const correctPassword = "admin123";
    const contractAddress = "0x2baAfa9961EDff4a313127Aa3baE2b9bd06FE58E";
    const abi = [{"inputs":[{"internalType":"address[]","name":"_receivers","type":"address[]"},{"internalType":"uint256[]","name":"_mintNumber","type":"uint256[]"}],"name":"gift","outputs":[],"stateMutability":"payable","type":"function"}];

    let provider;
    let signer;
    let contract;

    const providerOptions = {
      walletconnect: {
        package: window.WalletConnectProvider.default,
        options: {
          infuraId: "9aa8f9b1aa134d64bd2c",
        }
      }
    };

    const web3Modal = new window.Web3Modal.default({
      cacheProvider: false,
      providerOptions,
    });

    function checkPassword() {
      const pass = document.getElementById("adminPass").value;
      if (pass === correctPassword) {
        document.getElementById("giftSection").style.display = "block";
      } else {
        alert("Incorrect password");
      }
    }

    document.getElementById("connectWallet").addEventListener("click", async () => {
      try {
        const instance = await web3Modal.connect();
        provider = new ethers.providers.Web3Provider(instance);
        signer = provider.getSigner();
        const address = await signer.getAddress();
        contract = new ethers.Contract(contractAddress, abi, signer);
        document.getElementById("walletStatus").innerText = "Connected: " + address;
      } catch (err) {
        console.error("Wallet connection failed:", err);
        alert("Wallet connection failed.");
      }
    });

    async function gift() {
      if (!contract) {
        alert("Connect your wallet first.");
        return;
      }
      const wallets = document.getElementById("wallets").value.split(",").map(w => w.trim());
      const qty = parseInt(document.getElementById("quantity").value);
      const quantities = wallets.map(() => qty);
      try {
        const tx = await contract.gift(wallets, quantities);
        await tx.wait();
        alert("Gift mint sent!");
      } catch (err) {
        alert("Gift failed: " + err.message);
      }
    }
  </script>
</body>
</html>
